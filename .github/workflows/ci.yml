name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wenshi
          POSTGRES_PASSWORD: wenshi
          POSTGRES_DB: wenshi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wenshi -d wenshi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://wenshi:wenshi@localhost:5432/wenshi_test
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: test-secret-with-more-than-thirty-two-bytes
      ADMIN_USERNAME: admin@wenshi.local
      ADMIN_PASSWORD: test-admin-password
      PHONE_VERIFICATION_PROVIDER: mock
      EMAIL_VERIFICATION_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q
