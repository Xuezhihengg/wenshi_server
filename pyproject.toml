[project]
name = "wenshi-server"
version = "0.1.0"
description = "Backend and monitoring system for Wenshi app."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.3",
  "alibabacloud-credentials>=1.0.2",
  "alibabacloud-dm20151123>=1.0.1",
  "alibabacloud-dypnsapi20170525==2.0.0",
  "alibabacloud-dysmsapi20170525>=4.1.0",
  "alibabacloud-tea-openapi>=0.3.15",
  "asyncpg>=0.29.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "greenlet>=3.1.1",
  "httpx>=0.27.2",
  "prometheus-client>=0.21.0",
  "pydantic-settings>=2.5.2",
  "pyjwt>=2.9.0",
  "python-json-logger>=2.0.7",
  "python-multipart>=0.0.27",
  "redis>=5.1.1",
  "sqlalchemy[asyncio]>=2.0.35",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps/api/app", "apps/api/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]
