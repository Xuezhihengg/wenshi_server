user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 20m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  upstream wenshi_api { server api:8000; }
  upstream wenshi_admin { server admin-web:80; }
  upstream wenshi_portal { server portal-web:80; }

  server {
    listen 80 default_server;
    server_name wenshi.xin www.wenshi.xin;

    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type text/plain;
      try_files $uri =404;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    server_name wenshi.xin www.wenshi.xin;

    ssl_certificate /etc/nginx/certs/live/wenshi.xin/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/wenshi.xin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
      proxy_pass http://wenshi_api;
    }

    location /uploads/ {
      proxy_pass http://wenshi_api;
    }

    location /admin/ {
      proxy_pass http://wenshi_admin;
    }

    location = /admin {
      return 301 /admin/;
    }

    location / {
      proxy_pass http://wenshi_portal;
    }
  }
}
